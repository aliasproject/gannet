[package]
name = "gannet-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rustix.workspace = true
libc.workspace = true
md5 = "0.8.1"
zbus.workspace = true
futures-core = "0.3"
serde = "1"

# The stand-in udisks2 for the checks serves an object manager, which Gannet itself never does.
[dev-dependencies]
zbus = { workspace = true, features = ["object-manager"] }
